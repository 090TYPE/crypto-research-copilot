[project]
name = "crypto-research-copilot"
version = "0.1.0"
description = "RAG + agent copilot for crypto research (FastAPI, LangChain, Chroma, Ollama)"
readme = "README.md"
requires-python = ">=3.11"

# Core service deps — kept light so `uv sync` is fast in early stages.
# Heavy AI stack lives in the optional `ai` group, installed from Stage 2.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
ai = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
